# Builds the Docker image and deploys the Worker + Container to Cloudflare (docs/SETUP.md, step 3).
# GitHub's runner has Docker, so no Docker is needed on anyone's PC.
# Switched off until the repository variable CLOUDFLARE_DEPLOY is "true" and the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set (Settings → Secrets and variables → Actions).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
